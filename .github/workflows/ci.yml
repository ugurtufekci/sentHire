# The full local battery, enforced on every push: lint, the complete test
# suite against a real Postgres (citext + pgvector, exactly like production),
# the offline golden scenarios (which must be 100% clean — docs/13 §6), and
# the web typecheck + production build. What we verify by hand today, this
# verifies on every change forever.

name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  backend:
    name: backend (lint, tests, goldens)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Official pgvector build on Postgres 16 — ships both extensions the
        # initial migration creates (vector + citext).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test suite (migrations + end-to-end included)
        env:
          SENTHIRE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
        run: pytest
      - name: Golden scenarios (offline, must be clean)
        run: python -m senthire.evals

  web:
    name: web (typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
