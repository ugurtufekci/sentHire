services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: senthire
      POSTGRES_PASSWORD: senthire
      POSTGRES_DB: senthire
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senthire"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: senthire
      MINIO_ROOT_PASSWORD: senthire-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  api:
    build: .
    command: >
      sh -c "alembic upgrade head &&
             python -m senthire.seed &&
             python -c 'from senthire.services.storage import ensure_bucket; ensure_bucket()' &&
             uvicorn senthire.api.app:app --host 0.0.0.0 --port 8000"
    environment: &app_env
      SENTHIRE_DATABASE_URL: postgresql+psycopg://senthire:senthire@db:5432/senthire
      SENTHIRE_REDIS_URL: redis://redis:6379/0
      SENTHIRE_S3_ENDPOINT_URL: http://minio:9000
      # presigned URLs are signed for the host the BROWSER reaches
      SENTHIRE_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      # opt-in curl/scripting backdoor for local dev; leave unset in production
      SENTHIRE_DEV_API_KEY: dev-local-key
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in your shell or .env}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
      minio: {condition: service_started}

  worker:
    build: .
    command: celery -A senthire.workers.celery_app worker -Q parse,screen,poll -c 8 --loglevel=info
    environment: *app_env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
      minio: {condition: service_started}

  web:
    build: ./web
    environment:
      API_PROXY_TARGET: http://api:8000
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_started}

volumes:
  pgdata:
  minio:
